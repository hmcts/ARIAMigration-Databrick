            min_workers: 5
            max_workers: 8
            mode: ENHANCED
      libraries:
        - notebook:
            path: "/Workspace/live/ARCHIVE_FROM_MASTER/APPEALS/ARIAFPA/ARIADM_ARM_APPEALS_FPA"
      target: hive_ariadm_arm_fpa
      development: true
