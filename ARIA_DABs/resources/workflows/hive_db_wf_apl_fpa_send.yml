resources:
  jobs:
    hive_db_wf_apl_fpa_send_job:
      name: hive_db_wf_apl_fpa_send_job
      job_clusters:
        - job_cluster_key: hive_db_wf_apl_fpa_send_job
          new_cluster:
            spark_version: ${var.cluster_config.spark_version}
            num_workers: 8
            instance_pool_id: ${var.instance_pool_id}
            driver_instance_pool_id: ${var.instance_pool_id}
            runtime_engine: PHOTON

      tasks:
        - task_key: hive_run-my-wheel
          job_cluster_key: hive_db_wf_apl_fpa_send_job
          python_wheel_task:
            entry_point: main
            package_name: shared_functions
          libraries: 
            - whl: "dbfs:/FileStore/packages/hive_shared_functions-0.6.6-py3-none-any.whl"

        - task_key: hive_DLT_creation_of_content
          depends_on:
            - task_key: hive_run-my-wheel
          pipeline_task:
            pipeline_id: ${resources.pipelines.hive_pipeline_pl_ariadm_arm_fpa.id}
            full_refresh: false
        
        - task_key: hive_audit_processing_fpa
          job_cluster_key: hive_db_wf_apl_fpa_send_job
          depends_on:
            - task_key: hive_DLT_creation_of_content
          notebook_task:
            notebook_path: "/Workspace/live/ARCHIVE_FROM_MASTER/APPEALS/ARIAFPA/ARIADM_ARM_AUDIT_DATA_PROCESSING_FPA"
            source: WORKSPACE

        - task_key: hive_publish_HTML_JSON_to_evh
          job_cluster_key: hive_db_wf_apl_fpa_send_job
          depends_on:
            - task_key: hive_audit_processing_fpa
          notebook_task:
            notebook_path: "/Workspace/live/ARCHIVE_FROM_MASTER/APPEALS/ARIAFPA/ARIA_ADLS_TO_EVENTHUBS_GENRIC_FPA"
            base_parameters: 
              file_types: html,json
            source: WORKSPACE
          
        - task_key: hive_html_json_ack
          depends_on:
            - task_key: hive_publish_HTML_JSON_to_evh
          notebook_task:
            notebook_path: "/Workspace/live/ARCHIVE_FROM_MASTER/APPEALS/ARIAFPA/ariafpa_html_json_acknowledge"
            source: WORKSPACE
          job_cluster_key: hive_db_wf_apl_fpa_send_job

        - task_key: hive_publish_A360_to_evh
          depends_on:
            - task_key: hive_html_json_ack
          notebook_task:
            notebook_path: "/Workspace/live/ARCHIVE_FROM_MASTER/APPEALS/ARIAFPA/ARIA_ADLS_TO_EVENTHUBS_GENRIC_FPA"
            base_parameters:
              file_types: a360
            source: WORKSPACE
          job_cluster_key: hive_db_wf_apl_fpa_send_job
         
        - task_key: hive_a360_ack
          depends_on:
            - task_key: hive_publish_A360_to_evh
          notebook_task:
            notebook_path: "/Workspace/live/ARCHIVE_FROM_MASTER/APPEALS/ARIAFPA/ariafpa_a360_acknowledge"
            source: WORKSPACE
          job_cluster_key: hive_db_wf_apl_fpa_send_job
      queue:
        enabled: true   