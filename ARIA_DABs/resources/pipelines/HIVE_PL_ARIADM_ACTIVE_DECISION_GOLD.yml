resources:
  pipelines:
    hive_pipeline_pl_decision_gold:
      name: HIVE_PL_decision_gold
      configuration:
        pipelines.tableManagedByMultiplePipelinesCheck.enabled: "false"
      clusters:
        - label: default
          instance_pool_id: ${var.instance_pool_id}
          autoscale:
            min_workers: 1
            max_workers: 8
            mode: ENHANCED
      libraries:
        - notebook:
            path: "/Workspace/live/ACTIVE_FROM_MASTER/APPEALS/GOLD_DECISION_JSON"
      target: hive_decision_gold
      development: true