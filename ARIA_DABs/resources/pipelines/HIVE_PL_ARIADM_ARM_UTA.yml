            min_workers: 5
            max_workers: 8
            mode: ENHANCED
      libraries:
        - notebook:
            path: "/Workspace/live/ARCHIVE_FROM_MASTER/APPEALS/ARIAUTA/ARIADM_ARM_APPEALS_UTA"
      target: hive_ariadm_arm_uta
      development: true