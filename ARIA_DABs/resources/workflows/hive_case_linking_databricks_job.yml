resources:
  jobs:
    hive_case_linking_databricks_job:
      name: hive_case_linking_databricks_job
      job_clusters:
        - job_cluster_key: hive_case_linking_databricks_job
          new_cluster:
            spark_version: ${var.cluster_config.spark_version}
            num_workers: 4
            instance_pool_id: ${var.instance_pool_id}
            driver_instance_pool_id: ${var.instance_pool_id}
            runtime_engine: PHOTON
      tasks:        
        - task_key: hive_DLT_creation_of_case_linking
          pipeline_task:
            pipeline_id: ${resources.pipelines.hive_pipeline_pl_ariadm_active_appeals_case_linking.id}
            full_refresh: true
        - task_key: hive_active_case_link_publish
          depends_on: 
            - task_key: hive_DLT_creation_of_case_linking
          job_cluster_key: hive_case_linking_databricks_job
          notebook_task:
            notebook_path: "/Workspace/live/ACTIVE_FROM_MASTER/MVP/CaseLinking/Active_CCD_Publish_Case_Linking"
            source: WORKSPACE
